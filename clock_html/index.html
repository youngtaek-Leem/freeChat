<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Clock</title>
    <meta name="description" content="A stunning, modern digital clock with glassmorphism design and smooth animations.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <main class="container">
        <div class="glass-card" id="clock-card">
            <h1 class="date-text" id="date-display">2026년 4월 11일</h1>
            <div class="clock-content">
                <span id="hours">00</span>
                <span class="separator">:</span>
                <span id="minutes">00</span>
                <span class="separator">:</span>
                <span id="seconds">00</span>
            </div>
            <p class="greeting" id="greeting-text">안녕하세요, 현재 시간입니다.</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
